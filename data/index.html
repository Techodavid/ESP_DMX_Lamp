<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DMX Monitor</title>
<style>
body { font-family: monospace; background:#111; color:#0f0; }
</style>
</head>
<body>

<h2>DMX Monitor</h2>

Frames: <span id="frames">0</span><br>
Interval (µs): <span id="interval">0</span><br>
ESP Temp: <span id="temp">0</span> °C<br>
Status: <span id="status">---</span><br><br>

Start Address:
<input type="number" id="startInput" min="1" max="508">
<button onclick="saveStart()">Save</button>
<span id="currentStart"></span>

<button onclick="toggleChannels()">Toggle Channels</button>

<br><br>
Mode:
<select id="modeSelect">
    <option value="6">6 Channel</option>
    <option value="3">3 Channel</option>
</select>
<button onclick="saveMode()">Save Mode</button>
Current Mode: <span id="currentMode">---</span><br><br>
<div id="channels"
     style="display:none; grid-template-columns: repeat(16, 1fr); gap:2px; font-size:10px;">
</div>


<script>

let showChannels = false;

function toggleChannels() {
    showChannels = !showChannels;
    document.getElementById('channels').style.display =
        showChannels ? "grid" : "none";
}

async function update() {
    try {
        const response = await fetch(showChannels ? '/data?ch=1' : '/data');

        const data = await response.json();

        document.getElementById('frames').textContent = data.frames;
        document.getElementById('interval').textContent = data.interval;
        document.getElementById('temp').textContent = data.temp;

        if (data.signal) {
            document.getElementById('status').textContent = "Signal OK";
            document.getElementById('status').style.color = "lime";
        } else {
            document.getElementById('status').textContent = "Signal LOST";
            document.getElementById('status').style.color = "red";
        }

        if (showChannels) {

            let container = document.getElementById('channels');
            container.innerHTML = "";

            for (let i = 0; i < data.ch.length; i++) {

                let value = data.ch[i];

                let div = document.createElement("div");

                div.style.border = "1px solid #033";
                div.style.padding = "2px";
                div.style.background = "rgb(0," + value + ",0)";

                div.innerHTML = (i+1) + "<br>" + value;

                container.appendChild(div);
            }
        }

    } catch (e) {
        document.getElementById('status').textContent = "No Connection";
        document.getElementById('status').style.color = "orange";
    }
}

async function loadConfig() {
    const response = await fetch('/config');
    const data = await response.json();

    document.getElementById('startInput').value = data.start;
    document.getElementById('currentStart').textContent =
        "Current: " + data.start;

    document.getElementById('modeSelect').value = data.mode;

    document.getElementById('currentMode').textContent =
        data.mode == 3 ? "3 Channel" : "6 Channel";
}

async function saveMode() {

    let mode = document.getElementById('modeSelect').value;

    await fetch('/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'mode=' + mode
    });

    loadConfig();
}


async function saveStart() {

    let value = document.getElementById('startInput').value;

    await fetch('/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'start=' + value
    });

    loadConfig();
}

setInterval(update, 200);
update();
loadConfig();

</script>

</body>
</html>
